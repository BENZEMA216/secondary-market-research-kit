name: Validate research kit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify release inputs
        run: python scripts/share.py verify
      - name: Check Skill environment
        run: python skills/scenario-router-research/scripts/research.py doctor
      - name: Run original engine validation in isolation
        run: python skills/scenario-router-research/scripts/research.py validate
      - name: Test Agent CLI and share/install boundaries
        run: python -m unittest discover -s tests -v
      - name: Build distributable archives
        run: python scripts/share.py build --output dist/0.2.0
  financial-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: skills/equity-research-toolkit/requirements.lock.txt
      - name: Install isolated financial/report dependencies
        run: python -m pip install -r skills/equity-research-toolkit/requirements.lock.txt
      - name: Verify release inputs
        run: python scripts/share.py verify
      - name: Check financial toolkit environment
        run: python scripts/toolkit.py doctor equity-research-toolkit
      - name: Run all integration tests with financial dependencies
        run: python -m unittest discover -s tests -v
      - name: Generate synthetic financial report and PDF
        run: python scripts/toolkit.py run equity-research-toolkit -- demo --output /tmp/secondary-equity-demo --pdf
